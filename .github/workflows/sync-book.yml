name: Sync chapters from Google Doc

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Sync from Google Doc
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python scripts/sync_from_doc.py

      - name: Commit and push if changed
        run: |
          git config user.name "book-sync-bot"
          git config user.email "actions@github.com"
          git add book/index.html
          git diff --cached --quiet || git commit -m "Sync chapters from Google Doc"
          git push
